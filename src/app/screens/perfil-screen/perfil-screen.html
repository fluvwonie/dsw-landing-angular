<main class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body text-center">
      <img src="assets/img/profile.jpeg" alt="Foto de perfil"
           class="rounded-circle mb-3" width="160" height="160"
           style="object-fit: cover;">
      <h2 class="card-title">{{ perfil.nombre }}</h2>
    </div>

    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <i class="bi bi-envelope me-2"></i>{{ perfil.email }}
      </li>
      <li class="list-group-item">
        <i class="bi bi-telephone me-2"></i>{{ perfil.telefono }}
      </li>
      <li class="list-group-item">
        <i class="bi bi-geo-alt me-2"></i>{{ perfil.direccion }}
      </li>
      <li class="list-group-item">
        <i class="bi bi-calendar-event me-2"></i>{{ perfil.fechaNacimiento }}
      </li>
    </ul>
  </div>
</main>
