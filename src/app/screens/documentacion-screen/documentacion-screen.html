<main class="container py-5">
  <section class="text-center mb-5">
    <h1 class="fw-bold">Documentación</h1>
    <p class="lead">Consulta la documentación oficial de Angular.</p>
    <a href="https://angular.dev" target="_blank" rel="noopener noreferrer"
       class="btn btn-dark">
      <i class="bi bi-box-arrow-up-right me-2"></i>Ir a angular.dev
    </a>
  </section>

  <div id="carruselTec" class="carousel slide mx-auto" style="max-width: 700px;">
    <div class="carousel-indicators">
      @for (s of slides; track s.nombre; let i = $index) {
        <button type="button" data-bs-target="#carruselTec" [attr.data-bs-slide-to]="i"
                [class.active]="i === 0" [attr.aria-label]="'Diapositiva ' + (i + 1)"></button>
      }
    </div>

    <div class="carousel-inner">
      @for (s of slides; track s.nombre; let i = $index) {
        <div class="carousel-item" [class.active]="i === 0">
          <img [src]="s.imagen" [alt]="s.nombre" class="d-block w-100"
               style="height: 380px; object-fit: contain;">
          <div class="carousel-caption d-none d-md-block">
            <h5 class="text-dark">{{ s.nombre }}</h5>
          </div>
        </div>
      }
    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#carruselTec" data-bs-slide="prev">
      <span class="carousel-control-prev-icon bg-dark rounded-circle p-3"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button"
            data-bs-target="#carruselTec" data-bs-slide="next">
      <span class="carousel-control-next-icon bg-dark rounded-circle p-3"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</main>
